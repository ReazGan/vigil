[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil"
version = "0.1.0"
description = "Network intrusion detection engine: live/pcap capture with modular signature and behavioral detectors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baran Ayaztas" }]
keywords = ["ids", "nids", "network", "security", "intrusion-detection", "pcap"]
dependencies = [
    "scapy>=2.5",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pyjwt>=2.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
vigil = "vigil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
